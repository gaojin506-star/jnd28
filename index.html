<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>加拿大28数据助手</title>
<style>
:root{--bg:#07111d;--card:#0d1b2a;--line:#20354b;--gold:#f6c453;--text:#f5f7fa;--muted:#8fa3b8;--green:#55d68b;--red:#ff7272;--panel:#102338}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(#07111d,#0b1826);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
main{max-width:560px;margin:auto;padding:16px}.head{display:flex;justify-content:space-between;align-items:center;margin:8px 0 14px}.head b{font-size:22px}
.tag{font-size:12px;background:var(--gold);color:#111;padding:5px 9px;border-radius:20px;font-weight:800}.ad{display:block;background:linear-gradient(135deg,#6c2cff,#ff5d8f);padding:18px;border-radius:16px;text-align:center;font-weight:800;margin-bottom:12px;color:#fff;text-decoration:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}.label{font-size:13px;color:var(--muted);margin-bottom:8px}
.issue{font-weight:800;font-size:18px}.big{font-size:28px;color:var(--gold);font-weight:900}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.tab{border:1px solid var(--line);background:#0b1724;color:var(--muted);padding:12px 5px;border-radius:12px;font-weight:800}.tab.active{background:var(--gold);color:#111}
.panel{display:none}.panel.active{display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pick{background:var(--panel);border:1px solid var(--line);border-radius:14px;text-align:center;padding:14px}
.pick strong{display:block;color:var(--gold);font-size:22px;margin-top:5px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;text-align:center;padding:10px}.stat b{display:block;color:var(--gold);font-size:18px}
.stat small{color:var(--muted)}.tablewrap{overflow-x:auto;max-height:420px}table{width:100%;border-collapse:collapse;font-size:12px;min-width:520px}th,td{text-align:center;padding:9px 5px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);position:sticky;top:0;background:var(--card)}.hit{color:var(--green);font-weight:900}.miss{color:var(--red);font-weight:900}.pending{color:var(--gold);font-weight:800}.warn{font-size:12px;color:var(--muted);line-height:1.6;text-align:center}
</style></head>
<body><main>
<div class="head"><b>加拿大28数据助手</b><span class="tag">后台自动版</span></div>
<a class="ad" href="#" onclick="return false">你的广告位｜可继续修改</a>

<section class="card">
<div class="label">后台更新时间</div><div id="updatedAt" class="issue">读取中…</div>
<div class="label" style="margin-top:12px">最新开奖</div><div id="latest" class="big">--</div>
<div class="label" style="margin-top:12px">下一期</div><div id="nextIssue" class="issue">--</div>
</section>

<section class="card">
<div class="label">最近100期开奖</div>
<div class="tablewrap"><table><thead><tr><th>期号</th><th>和值</th><th>大小</th><th>单双</th><th>双组合</th></tr></thead><tbody id="drawHistory"><tr><td colspan="5" class="pending">等待后台导入…</td></tr></tbody></table></div>
</section>

<div class="tabs">
<button class="tab active" data-id="a1">算法一</button><button class="tab" data-id="a2">算法二</button><button class="tab" data-id="a3">算法三</button>
</div>

<div id="panels"></div>

<div class="warn">后台数据由 GitHub Actions 自动更新；关闭网页后，后台仍会继续记录。历史开奖与真实预测记录分开保存，历史数据不会冒充预测命中记录。</div>

<script>
let STATE=null;
const names={a1:"算法一",a2:"算法二",a3:"算法三"};
function stats(records,limit,key){const r=(records||[]).slice(0,limit).filter(x=>x[key]!==null&&x[key]!==undefined);return r.length?`${r.filter(x=>x[key]).length}/${r.length}`:"--";}
function drawParts(combo){const s=String(combo||'');return {size:s.includes('小')?'小':s.includes('大')?'大':'--',parity:s.includes('单')?'单':s.includes('双')?'双':'--'};}
function renderDrawHistory(){const h=(STATE.drawHistory||[]).slice(0,100);document.getElementById('drawHistory').innerHTML=h.length?h.map(r=>{const p=drawParts(r.combo);return `<tr><td>${r.issue}</td><td>${r.sum}</td><td>${p.size}</td><td>${p.parity}</td><td>${r.combo}</td></tr>`}).join(''):'<tr><td colspan="5" class="pending">等待后台导入…</td></tr>';}
function panel(id){
  const a=STATE.algorithms[id], s=STATE.simulations[id], cur=a.current;
  const bet=s.pending&&s.pending.combos?.length>=2?s.pending.combos.map(c=>c+s.stake).join("　"):"跳过";
  const rows=(a.records||[]).slice(0,20).map(r=>`<tr><td>${r.issue}</td><td>${r.combos.join(" / ")}</td><td>${r.kill||"--"}</td><td>${r.actualCombo} / ${r.actualSum}</td><td class="${r.comboHit?"hit":"miss"}">${r.comboHit?"中":"错"}</td><td class="${r.killSuccess?"hit":"miss"}">${r.killSuccess?"成功":"失败"}</td></tr>`).join("");
  return `<section class="panel ${id==="a1"?"active":""}" id="${id}">
    <div class="card"><div class="label">${a.name}</div><div class="grid"><div class="pick">双组合<strong>${cur?cur.combos.join(" / "):"--"}</strong></div><div class="pick">杀组<strong>${cur?.kill||"--"}</strong></div></div><div class="label" style="margin-top:12px">模型信心：${cur?.confidence??"--"}%</div></div>
    <div class="card"><div class="label">${names[id]}｜300→500积分测试</div><div class="grid"><div class="pick">当前积分<strong>${s.points}</strong></div><div class="pick">单边积分<strong>${s.stake}</strong></div></div><div class="grid" style="margin-top:10px"><div class="pick">当前手数<strong>${s.step}</strong></div><div class="pick">当前轮次<strong>${s.round}</strong></div></div><div class="label" style="margin-top:12px">推荐投注</div><div class="big">${bet}</div><div class="stats"><div class="stat"><b>${s.success}</b><small>成功轮数</small></div><div class="stat"><b>${s.fail}</b><small>失败轮数</small></div><div class="stat"><b>${s.net>=0?"+":""}${s.net}</b><small>累计模拟</small></div><div class="stat"><b>${s.pending?"等待开奖":"等待预测"}</b><small>当前状态</small></div></div></div>
    <div class="card"><div class="label">预测统计</div><div class="stats"><div class="stat"><b>${stats(a.records,20,"comboHit")}</b><small>近20期双组合</small></div><div class="stat"><b>${stats(a.records,20,"killSuccess")}</b><small>近20期杀组</small></div><div class="stat"><b>${stats(a.records,100,"comboHit")}</b><small>近100期双组合</small></div><div class="stat"><b>${stats(a.records,100,"killSuccess")}</b><small>近100期杀组</small></div></div></div>
    <div class="card"><div class="label">近期预测记录</div><div class="tablewrap"><table><thead><tr><th>期号</th><th>双组合</th><th>杀组</th><th>实际</th><th>双组</th><th>杀组</th></tr></thead><tbody>${rows||'<tr><td colspan="6" class="pending">等待后台产生记录…</td></tr>'}</tbody></table></div></div>
  </section>`;
}
async function load(){try{const r=await fetch("data/state.json?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw Error(r.status);STATE=await r.json();document.getElementById("updatedAt").textContent=STATE.updatedAt?new Date(STATE.updatedAt).toLocaleString():"尚未运行后台任务";document.getElementById("latest").textContent=STATE.latestDraw?`${STATE.latestDraw.issue}｜${STATE.latestDraw.combo} ${STATE.latestDraw.sum}`:"--";document.getElementById("nextIssue").textContent=STATE.nextIssue||"--";renderDrawHistory();document.getElementById("panels").innerHTML=["a1","a2","a3"].map(panel).join("");bindTabs();}catch(e){document.getElementById("updatedAt").textContent="数据读取失败";}}
function bindTabs(){document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));document.querySelectorAll(".panel").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.getElementById(b.dataset.id).classList.add("active");});}
load();setInterval(load,15000);
</script></main></body></html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#081018">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>星哥 · 28自动分析</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
<header class="topbar">
  <div class="brand"><div class="logo">星</div><div><h1>28 自动分析</h1><p>自动开奖 · 自动预测 · 自动回测</p></div></div>
  <div class="online"><i></i><span id="onlineText">运行中</span></div>
</header>

<section class="card countdown-card">
  <div class="title-row"><div><h2>开奖倒计时</h2><p id="issueText">正在获取最新开奖</p></div><button id="syncBtn" class="mini">刷新</button></div>
  <div class="countdown"><span>距离下期开奖</span><strong id="countdown">--:--</strong></div>
  <div id="syncHint" class="hint">正在检测最新数据</div>
</section>

<section class="card">
  <div class="title-row"><div><h2>自动分析</h2><p id="nextIssueText">等待分析</p></div><span class="state">自动</span></div>
  <div class="predictions">
    <div class="prediction main-pick"><small>参考一</small><strong id="pick1">--</strong><span id="score1">参考度 --</span></div>
    <div class="prediction"><small>参考二</small><strong id="pick2">--</strong><span id="score2">参考度 --</span></div>
  </div>
  <div class="reason"><span>分析提示</span><p id="reason">等待开奖历史。</p></div>
</section>

<section class="card">
  <div class="title-row"><div><h2>自动4码</h2><p id="fourIssueText">等待分析</p></div><span class="state">自动</span></div>
  <div id="fourCodes" class="codes"><b>--</b><b>--</b><b>--</b><b>--</b></div>
</section>

<section class="card history-card">
  <div class="title-row"><div><h2>历史记录</h2><p>默认最近10期 · 可展开更多</p></div><span id="lastSync" class="mini">未同步</span></div>
  <div class="history-head"><span>实际开奖结果</span><span>自动参考</span><span>对/错</span><span>4码</span><span>对/错</span></div>
  <div id="historyList" class="history-list"><div class="empty">暂无回测记录</div></div>
  <button id="moreBtn" class="more-btn" hidden>展开更多记录</button>
</section>

<footer>预测仅用于数据观察与回测，不保证未来开奖结果。</footer>
</main>
<script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#081018">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>星哥 · 28实时分析</title>
<link rel="stylesheet" href="style.css?v=202608152135">
</head>
<body>
<main class="app">
<header class="topbar">
  <div class="brand"><div class="logo">星</div><div><h1>28 实时分析</h1><p>实时开奖 · 自动预测 · 自动核对</p></div></div>
  <div class="online"><i></i><span id="onlineText">连接中</span></div>
</header>
<section class="card countdown-card">
  <div class="title-row"><div><h2>实时开奖</h2><p id="issueText">正在获取最新开奖</p></div><button id="syncBtn" class="mini">立即刷新</button></div>
  <div class="countdown"><span>距离下期开奖</span><strong id="countdown">--:--</strong></div>
  <div id="syncHint" class="hint">正在连接实时数据</div>
</section>
<section class="card">
  <div class="title-row"><div><h2>下一期预测</h2><p id="nextIssueText">等待分析</p></div><span class="state">实时</span></div>
  <div class="predictions">
    <div class="prediction main-pick"><small>参考一</small><strong id="pick1">--</strong><span id="score1">参考度 --</span></div>
    <div class="prediction"><small>参考二</small><strong id="pick2">--</strong><span id="score2">参考度 --</span></div>
  </div>
  <div class="reason"><span>分析提示</span><p id="reason">等待开奖历史。</p></div>
</section>
<section class="stats-grid">
  <div class="stat-card"><span>已核对</span><strong id="settledCount">0</strong><small>期</small></div>
  <div class="stat-card"><span>预测命中</span><strong id="hitCount">0</strong><small>期</small></div>
  <div class="stat-card"><span>命中率</span><strong id="hitRate">--</strong><small>实时统计</small></div>
</section>
<section class="card history-card">
  <div class="title-row"><div><h2>预测核对记录</h2><p>开奖后自动判断对 / 错</p></div><span id="lastSync" class="mini">未同步</span></div>
  <div class="history-head"><span>实际开奖结果</span><span>开奖前预测</span><span>结果</span></div>
  <div id="historyList" class="history-list"><div class="empty">暂无核对记录</div></div>
  <button id="moreBtn" class="more-btn" hidden>展开更多记录</button>
</section>
<footer>数据自动刷新；预测仅用于历史统计与回测，不保证未来开奖结果。</footer>
</main>
<script src="app.js?v=202608152135"></script>
</body>
</html>

<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>加拿大28数据助手</title><style>:root{--bg:#07111d;--card:#0d1b2a;--line:#20354b;--gold:#f6c453;--text:#f5f7fa;--muted:#8fa3b8;--green:#55d68b;--red:#ff7272;--panel:#102338}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#07111d,#0b1826);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}main{max-width:560px;margin:auto;padding:16px}.head{display:flex;justify-content:space-between;align-items:center;margin:8px 0 14px}.head b{font-size:22px}.tag{font-size:12px;background:var(--gold);color:#111;padding:5px 9px;border-radius:20px;font-weight:800}.ad{display:block;background:linear-gradient(135deg,#6c2cff,#ff5d8f);padding:18px;border-radius:16px;text-align:center;font-weight:800;margin-bottom:12px;color:#fff;text-decoration:none}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}.label{font-size:13px;color:var(--muted);margin-bottom:8px}.issue{font-weight:800;font-size:18px}.big{font-size:28px;color:var(--gold);font-weight:900}.countdown{font-size:34px;color:var(--gold);font-weight:900;letter-spacing:2px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.tab{border:1px solid var(--line);background:#0b1724;color:var(--muted);padding:12px 5px;border-radius:12px;font-weight:800}.tab.active{background:var(--gold);color:#111}.panel{display:none}.panel.active{display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pick{background:var(--panel);border:1px solid var(--line);border-radius:14px;text-align:center;padding:14px}.pick strong{display:block;color:var(--gold);font-size:22px;margin-top:5px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;text-align:center;padding:10px}.stat b{display:block;color:var(--gold);font-size:18px}.stat small{color:var(--muted)}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:12px;min-width:520px}th,td{text-align:center;padding:9px 5px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--muted)}.hit{color:var(--green);font-weight:900}.miss{color:var(--red);font-weight:900}.pending{color:var(--gold);font-weight:800}.warn{font-size:12px;color:var(--muted);line-height:1.6;text-align:center}</style></head><body><main><div class="head"><b>加拿大28数据助手</b><span class="tag">旧版</span></div><a class="ad" href="#" onclick="return false">你的广告位｜可继续修改</a><section class="card"><div class="label">数据更新时间</div><div id="updatedAt" class="issue">读取中…</div><div class="label" style="margin-top:12px">最新开奖</div><div id="latest" class="big">--</div><div class="label" style="margin-top:12px">下一期</div><div id="nextIssue" class="issue">--</div><div class="label" style="margin-top:12px">距下一期开奖</div><div id="countdown" class="countdown">--:--</div></section><div class="tabs"><button class="tab active" data-id="a1">算法一</button><button class="tab" data-id="a2">算法二</button><button class="tab" data-id="a3">算法三</button></div><div id="panels"></div><div class="warn">三套算法保留原版本逻辑；历史统计仅反映已记录结果，不保证未来结果。</div><script>
let STATE=null,countdownSec=null,liveIssue=null;const cls=n=>(n<=13?'小':'大')+(n%2?'单':'双');const val=(o,ks)=>{for(const k of ks)if(o?.[k]!=null&&o[k]!=='')return o[k];};function stats(records,limit,key){const r=(records||[]).slice(0,limit).filter(x=>x[key]!==null&&x[key]!==undefined);return r.length?`${r.filter(x=>x[key]).length}/${r.length}`:'--';}
function panel(id){const a=STATE.algorithms[id],cur=a.current;const rows=(a.records||[]).slice(0,20).map(r=>`<tr><td>${r.issue}</td><td>${r.combos.join(' / ')}</td><td>${r.kill||'--'}</td><td>${r.actualCombo} / ${r.actualSum}</td><td class="${r.comboHit?'hit':'miss'}">${r.comboHit?'中':'错'}</td><td class="${r.killSuccess?'hit':'miss'}">${r.killSuccess?'成功':'失败'}</td></tr>`).join('');return `<section class="panel ${id==='a1'?'active':''}" id="${id}"><div class="card"><div class="label">${a.name}</div><div class="grid"><div class="pick">双组合<strong>${cur?cur.combos.join(' / '):'--'}</strong></div><div class="pick">杀组<strong>${cur?.kill||'--'}</strong></div></div><div class="label" style="margin-top:12px">模型信心：${cur?.confidence??'--'}%</div></div><div class="card"><div class="label">预测统计</div><div class="stats"><div class="stat"><b>${stats(a.records,20,'comboHit')}</b><small>近20期双组合</small></div><div class="stat"><b>${stats(a.records,20,'killSuccess')}</b><small>近20期杀组</small></div><div class="stat"><b>${stats(a.records,100,'comboHit')}</b><small>近100期双组合</small></div><div class="stat"><b>${stats(a.records,100,'killSuccess')}</b><small>近100期杀组</small></div></div></div><div class="card"><div class="label">近期预测记录</div><div class="tablewrap"><table><thead><tr><th>期号</th><th>双组合</th><th>杀组</th><th>实际</th><th>双组</th><th>杀组</th></tr></thead><tbody>${rows||'<tr><td colspan="6" class="pending">等待产生记录…</td></tr>'}</tbody></table></div></div></section>`;}
function bindTabs(){document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.id).classList.add('active')})}function setCountdown(v){if(v==null)return;let n=Number(v);if(!Number.isFinite(n)){const m=String(v).match(/(\d+):([0-5]?\d)/);if(m)n=Number(m[1])*60+Number(m[2])}if(Number.isFinite(n))countdownSec=Math.max(0,Math.floor(n))}function parseLive(j){const a=Array.isArray(j)?j:Array.isArray(j?.data)?j.data:Array.isArray(j?.data?.list)?j.data.list:[];const r=a[0]||j?.data||j;const issue=val(r,['nbr','issue','period','expect','qihao','no']);const raw=val(r,['number','sum','result','total','value']);const sum=Number(Array.isArray(raw)?raw.reduce((x,y)=>x+Number(y),0):raw);return {issue:issue==null?'':String(issue),sum,combo:String(val(r,['combination','combo','type'])||(Number.isFinite(sum)?cls(sum):'')),countdown:j?.countdown??j?.data?.countdown??r?.countdown}}async function syncLive(){try{const r=await fetch('https://pc28.help/api/kj.json?nbr=1&t='+Date.now(),{cache:'no-store'}),j=await r.json(),d=parseLive(j);setCountdown(d.countdown);if(d.issue&&Number.isFinite(d.sum)){document.getElementById('latest').textContent=`${d.issue}｜${d.combo} ${d.sum}`;document.getElementById('nextIssue').textContent=/^\d+$/.test(d.issue)?String(BigInt(d.issue)+1n):'下一期';if(liveIssue&&liveIssue!==d.issue)loadState();liveIssue=d.issue}}catch(e){}}function tickCountdown(){const el=document.getElementById('countdown');if(countdownSec==null){el.textContent='同步中…';return}if(countdownSec<=0){el.textContent='开奖中…';return}el.textContent=String(Math.floor(countdownSec/60)).padStart(2,'0')+':'+String(countdownSec%60).padStart(2,'0');countdownSec--}async function loadState(){try{const r=await fetch('data/state.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(r.status);STATE=await r.json();document.getElementById('updatedAt').textContent=STATE.updatedAt?new Date(STATE.updatedAt).toLocaleString():'尚未更新';if(!liveIssue&&STATE.latestDraw){document.getElementById('latest').textContent=`${STATE.latestDraw.issue}｜${STATE.latestDraw.combo} ${STATE.latestDraw.sum}`;document.getElementById('nextIssue').textContent=STATE.nextIssue||'--'}document.getElementById('panels').innerHTML=['a1','a2','a3'].map(panel).join('');bindTabs()}catch(e){document.getElementById('updatedAt').textContent='数据读取失败'}}loadState();syncLive();tickCountdown();setInterval(tickCountdown,1000);setInterval(syncLive,10000);setInterval(loadState,30000);
</script></main></body></html>

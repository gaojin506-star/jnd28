name: Auto update predictions

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: jnd28-auto-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Poll data in background
        env:
          POLL_LOOPS: "5"
          POLL_INTERVAL_MS: "55000"
        run: node scripts/update.mjs

      - name: Commit updated state
        run: |
          git config user.name "jnd28-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/state.json
          git diff --cached --quiet && exit 0
          git commit -m "Auto update predictions"
          git pull --rebase origin main
          git push

name: Auto update predictions

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: jnd28-auto-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configure git
        run: |
          git config user.name "jnd28-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Poll and publish repeatedly
        run: |
          for i in 1 2 3 4 5; do
            POLL_LOOPS=1 POLL_INTERVAL_MS=0 node scripts/update.mjs
            git add data/state.json
            if ! git diff --cached --quiet; then
              git commit -m "Auto update predictions"
              git pull --rebase origin main
              git push
            fi
            if [ "$i" != "5" ]; then
              sleep 55
            fi
          done

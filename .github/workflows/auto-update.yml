name: Live draw updater

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/update.mjs"
      - "index.html"
      - "app.js"
      - "style.css"
      - ".github/workflows/auto-update.yml"
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: jnd28-live-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configure git
        run: |
          git config user.name "jnd28-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Poll live draw source
        run: |
          for i in $(seq 1 30); do
            POLL_LOOPS=1 POLL_INTERVAL_MS=0 node scripts/update.mjs || true
            git add data/state.json
            if ! git diff --cached --quiet; then
              git commit -m "Live draw update"
              git pull --rebase origin main
              git push
            fi
            if [ "$i" != "30" ]; then
              sleep 10
            fi
          done
